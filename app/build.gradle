plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.surwi.compass360'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vediccompass360.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.5.0'
    }
    buildFeatures { buildConfig true }
    def gatewayUrl = project.findProperty('COMMERCIAL_API_BASE_URL') ?: ''
    defaultConfig.buildConfigField 'String', 'COMMERCIAL_API_BASE_URL', '\"' + gatewayUrl + '\"'
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'io.github.misrilibrary:tithi-engine:5.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
